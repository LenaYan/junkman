[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "junkman"
version = "0.1.0"
description = "Discover and download publicly accessible documents with provenance."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.48,<2"]
dev = ["ruff>=0.9,<1"]

[project.scripts]
junkman = "junkman:main"

[tool.setuptools]
py-modules = ["junkman", "junkman_browser"]

[tool.ruff]
target-version = "py39"
line-length = 110
